  <!-- الجافاسكريبت المدمج للأصوات والمشغل والصور -->
  <script>
    // 1. قائمة الأغاني الرسمية بروابط الصوت المباشرة
    const playlist = [
      { id: 1, title: 'الحب الجميل', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-b001-71fa-a83f-618c057e8dd1', duration: '04:12' },
      { id: 2, title: 'صابر وراضي', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-af3b-72ac-8c36-843b07cfa380', duration: '03:58' },
      { id: 3, title: 'لو كل عاشق', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-aeda-70f6-ba1d-5aa4221c0d14', duration: '04:45' },
      { id: 4, title: 'ارضي بالنصيب', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d77f-7191-adc3-4dcd847dba06', duration: '05:02' },
      { id: 5, title: 'شكرا', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d6ad-7229-a218-61041759d594', duration: '03:40' },
      { id: 6, title: 'ليل العاشقين', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d773-7248-bf6c-05b5f2c85b2f', duration: '04:22' },
      { id: 7, title: 'ذكريات', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d6f8-7174-92fa-7b5eaa7552ff', duration: '04:50' }
    ];

    // 2. محرك توليد أصوات سيارة BMW (Web Audio API)
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      getCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }
      playEngineStart() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.7, now);
        master.connect(ctx.destination);

        // نقرات محرك التشغيل (Starter Crank)
        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(85 + i * 15, now + i * 0.12);
          gain.gain.setValueAtTime(0.2, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.08);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.09);
        }

        // هدير المحرك العنيف (Twin-Turbo Roar)
        const roarStart = now + 0.35;
        const sub = ctx.createOscillator();
        const subGain = ctx.createGain();
        sub.type = 'triangle';
        sub.frequency.setValueAtTime(45, roarStart);
        sub.frequency.exponentialRampToValueAtTime(140, roarStart + 0.6);
        sub.frequency.exponentialRampToValueAtTime(70, roarStart + 1.8);
        sub.frequency.linearRampToValueAtTime(50, roarStart + 2.6);
        subGain.gain.setValueAtTime(0.01, roarStart);
        subGain.gain.linearRampToValueAtTime(0.65, roarStart + 0.2);
        subGain.gain.exponentialRampToValueAtTime(0.001, roarStart + 2.8);
        sub.connect(subGain);
        subGain.connect(master);
        sub.start(roarStart);
        sub.stop(roarStart + 2.85);
      }
      playThrottleRev() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.22);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.7);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.78);
      }
      playClick() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    }

    const sound = new SoundEngine();

    // 3. حالة المشغل الموسيقي
    let currentTrackIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;
    let isMuted = false;
    let activeTab = 'HOME';

    const audio = document.getElementById('globalAudio');
    // مستوى الصوت الافتراضي 100% كما طلبت
    audio.volume = 1.0;
    audio.src = playlist[0].url;

    const splashView = document.getElementById('splashView');
    const mainView = document.getElementById('mainView');
    const flashEffect = document.getElementById('flashEffect');

    const navHomeBtn = document.getElementById('navHomeBtn');
    const navMusicBtn = document.getElementById('navMusicBtn');
    const navAudioWave = document.getElementById('navAudioWave');

    const homeTab = document.getElementById('homeTab');
    const musicTab = document.getElementById('musicTab');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevTrackBtn = document.getElementById('prevTrackBtn');
    const nextTrackBtn = document.getElementById('nextTrackBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const mutedIcon = document.getElementById('mutedIcon');

    const currentSongTitle = document.getElementById('currentSongTitle');
    const currentSongArtist = document.getElementById('currentSongArtist');
    const progressBarFill = document.getElementById('progressBarFill');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const durationDisplay = document.getElementById('durationDisplay');
    const playlistPills = document.getElementById('playlistPills');

    // 4. تشغيل الفلاش والانتقال من شاشة البداية
    function triggerFlash() {
      flashEffect.classList.remove('hidden', 'opacity-0');
      flashEffect.classList.add('opacity-100');
      setTimeout(() => {
        flashEffect.classList.add('opacity-0');
        setTimeout(() => flashEffect.classList.add('hidden'), 700);
      }, 350);
    }

    splashView.addEventListener('click', () => {
      sound.playEngineStart();
      triggerFlash();
      setTimeout(() => {
        splashView.classList.add('hidden');
        mainView.classList.remove('hidden');
      }, 600);
    });

    document.getElementById('replayIntroBtn').addEventListener('click', () => {
      sound.playClick();
      mainView.classList.add('hidden');
      splashView.classList.remove('hidden');
    });

    // تفاعل الصورة الشخصية ونصوص POLA
    const photoCard = document.getElementById('personalPhotoCard');
    photoCard.addEventListener('click', () => {
      sound.playThrottleRev();
      photoCard.classList.add('ring-4', 'ring-white', 'brightness-125');
      setTimeout(() => photoCard.classList.remove('ring-4', 'ring-white', 'brightness-125'), 400);
    });

    document.getElementById('polaTextTrigger').addEventListener('click', () => sound.playThrottleRev());
    document.getElementById('crownTrigger').addEventListener('click', () => sound.playThrottleRev());

    // 5. التبديل فائق السلاسة بين القوائم بدون أي حركة (Zero Shift)
    function switchTab(target) {
      if (activeTab === target) return;
      sound.playClick();
      activeTab = target;

      if (target === 'HOME') {
        navHomeBtn.classList.add('opacity-100', 'scale-105');
        navHomeBtn.classList.remove('opacity-40');
        navHomeBtn.querySelector('.crown-icon').classList.add('text-white', 'fill-white');
        navHomeBtn.querySelector('.crown-icon').classList.remove('text-[#555555]', 'fill-[#555555]');
        navHomeBtn.querySelector('span').classList.add('text-white');
        navHomeBtn.querySelector('span').classList.remove('text-[#666666]');

        navMusicBtn.classList.remove('opacity-100', 'scale-105');
        navMusicBtn.classList.add('opacity-40');
        navMusicBtn.querySelector('.crown-icon').classList.remove('text-white', 'fill-white');
        navMusicBtn.querySelector('.crown-icon').classList.add('text-[#555555]', 'fill-[#555555]');
        navMusicBtn.querySelector('span').classList.remove('text-white');
        navMusicBtn.querySelector('span').classList.add('text-[#666666]');

        homeTab.classList.remove('hidden');
        musicTab.classList.add('hidden');
      } else {
        navMusicBtn.classList.add('opacity-100', 'scale-105');
        navMusicBtn.classList.remove('opacity-40');
        navMusicBtn.querySelector('.crown-icon').classList.add('text-white', 'fill-white');
        navMusicBtn.querySelector('.crown-icon').classList.remove('text-[#555555]', 'fill-[#555555]');
        navMusicBtn.querySelector('span').classList.add('text-white');
        navMusicBtn.querySelector('span').classList.remove('text-[#666666]');

        navHomeBtn.classList.remove('opacity-100', 'scale-105');
        navHomeBtn.classList.add('opacity-40');
        navHomeBtn.querySelector('.crown-icon').classList.remove('text-white', 'fill-white');
        navHomeBtn.querySelector('.crown-icon').classList.add('text-[#555555]', 'fill-[#555555]');
        navHomeBtn.querySelector('span').classList.remove('text-white');
        navHomeBtn.querySelector('span').classList.add('text-[#666666]');

        musicTab.classList.remove('hidden');
        homeTab.classList.add('hidden');
      }
    }

    navHomeBtn.addEventListener('click', () => switchTab('HOME'));
    navMusicBtn.addEventListener('click', () => switchTab('MUSIC'));

    // 6. تشغيل وتحديث المشغل الموسيقي
    function renderPlaylistPills() {
      playlistPills.innerHTML = '';
      playlist.forEach((song, idx) => {
        const isSel = idx === currentTrackIndex;
        const btn = document.createElement('button');
        btn.className = `text-[10px] font-tajawal px-2 py-0.5 rounded-md transition-all cursor-pointer whitespace-nowrap flex items-center gap-1 ${
          isSel
            ? 'bg-white text-black font-bold shadow-[0_0_8px_rgba(255,255,255,0.3)]'
            : 'bg-white/[0.03] hover:bg-white/[0.08] text-neutral-400 hover:text-white border border-transparent'
        }`;
        btn.innerHTML = `<span class="font-mono text-[9px] opacity-60">${idx + 1}</span><span>${song.title}</span>`;
        if (isSel && isPlaying) {
          btn.innerHTML += `<span class="w-1 h-1 rounded-full bg-black animate-ping"></span>`;
        }
        btn.onclick = () => selectTrack(idx);
        playlistPills.appendChild(btn);
      });
    }

    function updateTrackUI() {
      const song = playlist[currentTrackIndex];
      currentSongTitle.textContent = song.title;
      currentSongArtist.innerHTML = `${song.artist} <span class="text-neutral-600">•</span> XAT AUDIO`;
      renderPlaylistPills();
    }

    function selectTrack(idx) {
      currentTrackIndex = idx;
      audio.src = playlist[idx].url;
      audio.play().then(() => {
        isPlaying = true;
        updatePlayStateUI();
      }).catch(() => {});
      updateTrackUI();
    }

    function togglePlayPause() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => {
          isPlaying = true;
        }).catch(() => {});
      }
      updatePlayStateUI();
    }

    function updatePlayStateUI() {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        navAudioWave.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        navAudioWave.classList.add('hidden');
      }
      renderPlaylistPills();
    }

    playPauseBtn.addEventListener('click', togglePlayPause);

    nextTrackBtn.addEventListener('click', () => {
      let next = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentTrackIndex + 1) % playlist.length;
      selectTrack(next);
    });

    prevTrackBtn.addEventListener('click', () => {
      let prev = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      selectTrack(prev);
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('text-white', isShuffle);
      shuffleBtn.classList.toggle('bg-white/10', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('text-white', isRepeat);
      repeatBtn.classList.toggle('bg-white/10', isRepeat);
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      audio.muted = isMuted;
      volumeIcon.classList.toggle('hidden', isMuted);
      mutedIcon.classList.toggle('hidden', !isMuted);
    });

    function formatTime(s) {
      if (isNaN(s)) return '00:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBarFill.style.width = `${pct}%`;
        currentTimeDisplay.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationDisplay.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextTrackBtn.click();
      }
    });

    progressBarContainer.addEventListener('click', (e) => {
      const rect = progressBarContainer.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pct * audio.duration;
      }
    });

    // تشغيل القائمة المبدئية
    updateTrackUI();
  </script>
</body>
</html>
