<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POLA Portfolio - XAT Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Tajawal', sans-serif;
      background-color: #000000;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    .font-tajawal { font-family: 'Tajawal', sans-serif; }

    @keyframes gleamSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .group:hover .gleam-effect {
      animation: gleamSweep 0.9s ease-in-out forwards;
    }
    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-center items-center relative overflow-hidden">

  <!-- مشغل الصوت العام الخفي -->
  <audio id="globalAudio" preload="metadata"></audio>

  <!-- فلاش زينون الإضاءة الأمامية -->

  <!-- خلفية السيارة الداكنة في كامل الشاشة (Monochrome Stealth) -->

      src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=1920&auto=format&fit=crop"
      referrerpolicy="no-referrer"
      alt="BMW Stealth Car Headlights"
      class="w-full h-full object-cover object-center opacity-25 filter grayscale contrast-125 brightness-75 scale-105 transition-all duration-700"
    />
    <div class="absolute inset-0 bg-radial from-transparent via-black/60 to-black pointer-events-none"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none"></div>
  </div>

  <!-- ================= 1. شاشة البداية الافتتاحية ================= -->

    <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none">
      <img
        id="splashCarImg"
        src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=1920&auto=format&fit=crop"
        referrerpolicy="no-referrer"
        alt="Car Headlights in pitch black darkness"
        class="w-full h-full object-cover object-center filter brightness-95 contrast-110 transition-all duration-700"
      />
      <div class="absolute inset-0 bg-radial from-transparent via-black/40 to-black pointer-events-none"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-black/85 via-transparent to-black/90 pointer-events-none"></div>
    </div>

    <!-- كلمة POLA المعدنية الكبيرة في الأعلى -->
    <div class="relative z-10 w-full text-center pt-2 sm:pt-4">
      <h1 class="text-6xl sm:text-7xl md:text-8xl font-black uppercase tracking-tight select-none font-montserrat leading-none text-[#444444] transition-all duration-500 hover:text-white" style="letter-spacing: 0.04em; text-shadow: 0 4px 16px rgba(0,0,0,0.95);">
        POLA
      </h1>
    </div>

    <!-- مؤشر النقر لتشغيل المحرك -->
    <div class="relative z-10 flex flex-col items-center justify-center text-center my-auto px-4 pointer-events-none">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-white/[0.05] border border-white/[0.15] backdrop-blur-md flex items-center justify-center text-white/90 shadow-[0_0_30px_rgba(255,255,255,0.15)] animate-pulse mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <span class="text-[11px] sm:text-xs font-bold tracking-[0.25em] uppercase text-neutral-400 font-montserrat drop-shadow-md">
        اضغط في أي مكان لتشغيل المحرك والدخول
      </span>
    </div>

    <!-- عبارة GOD IS LOVE في الأسفل -->
    <div class="relative z-10 w-full text-center pb-2 sm:pb-4">
      <p class="text-xs sm:text-sm font-bold tracking-[0.32em] uppercase font-montserrat text-neutral-500">
        GOD IS LOVE
      </p>
    </div>
  </div>

  <!-- ================= 2. الواجهة الرئيسية الثابتة بالكامل ================= -->
  <div id="mainView" class="relative z-10 w-full min-h-screen flex items-center justify-center px-4 py-4 m-auto opacity-0 pointer-events-none transition-opacity duration-500">
    <div class="w-full max-w-xl sm:max-w-2xl h-[460px] sm:h-[490px] flex flex-col items-center justify-between my-auto relative">

      <!-- الجزء العلوي الثابت: أزرار التبويبات (لا تتحرك إطلاقاً) -->
      <div class="w-full h-12 flex items-center justify-center shrink-0 z-30">
        <nav class="flex items-center gap-6 sm:gap-10 px-6 sm:px-8 py-2 rounded-full bg-white/[0.04] backdrop-blur-md border border-white/[0.1] shadow-[0_0_30px_rgba(0,0,0,0.8)]">

          <button id="tabHomeBtn" onclick="switchTab('HOME')" class="group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-100 scale-105">
            <svg class="w-5 h-5 text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]" viewBox="0 0 24 24" fill="currentColor"><path d="M2 19h20v2H2v-2zM4 17l2.5-10 4 5 1.5-7 1.5 7 4-5 2.5 10H4z"/></svg>
            <span class="text-[12px] sm:text-xs font-black tracking-widest uppercase font-montserrat text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]">HOME</span>
          </button>

          <!-- تبويب MUSIC -->
          <button id="tabMusicBtn" onclick="switchTab('MUSIC')" class="group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-40 hover:opacity-85">

            <span class="text-[12px] sm:text-xs font-black tracking-widest uppercase font-montserrat text-[#666666] group-hover:text-neutral-200">MUSIC</span>

              <span class="w-0.5 h-3.5 bg-white rounded-full animate-pulse delay-100"></span>
              <span class="w-0.5 h-2 bg-white rounded-full animate-pulse delay-200"></span>

        <!-- محتوى HOME TAB -->

            <!-- الصورة الشخصية مع تأثيرات الـ Hover وفلاش النبض -->
            <div class="flex items-center justify-center shrink-0">

                <!-- علامة التاج في الزاوية -->

            <!-- معلومات الحساب والاسم -->

                POLA

              <div class="mt-1.5 sm:mt-2">

                  XAT.COM

              </div>

              <p class="mt-1 text-[10px] sm:text-xs md:text-sm font-semibold tracking-[0.22em] uppercase font-montserrat leading-none text-neutral-600">

              <!-- زر إعادة تشغيل البداية والصوت -->
              <button onclick="restartIntro()" class="mt-3.5 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.04] hover:bg-white/[0.1] border border-white/[0.08] hover:border-white/30 text-neutral-400 hover:text-white text-[11px] font-tajawal transition-all duration-200 cursor-pointer group shadow-sm">
                <svg class="w-3.5 h-3.5 text-neutral-400 group-hover:text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>إعادة تشغيل البداية والصوت</span>
                <svg class="w-3 h-3 text-neutral-400 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>
            </div>

          </div>
        </div>

        <!-- محتوى MUSIC TAB (مشغل كاجوال شبابي أنيق وصغير الحجم) -->
        <div id="musicTabContent" class="w-full h-full hidden items-center justify-center transition-all duration-300 opacity-0 scale-95">
          <div class="w-full max-w-sm sm:max-w-md flex flex-col items-center justify-center text-center p-3 sm:p-4 rounded-2xl bg-white/[0.02] backdrop-blur-md border border-white/[0.06] shadow-[0_0_25px_rgba(0,0,0,0.6)]">
            
            <!-- التاج الملكي -->
            <div class="mb-1 transition-transform duration-300 hover:scale-110">
              <svg class="w-7 h-7 text-[#484848] hover:text-white transition-colors drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]" viewBox="0 0 24 24" fill="currentColor"><path d="M2 19h20v2H2v-2zM4 17l2.5-10 4 5 1.5-7 1.5 7 4-5 2.5 10H4z"/></svg>
            </div>

            <!-- اسم الأغنية الحالية -->
            <h2 id="musicTitle" class="text-xl sm:text-2xl font-black text-white font-tajawal tracking-tight truncate leading-tight w-full">
              الحب الجميل
            </h2>
            <p id="musicArtist" class="text-[11px] text-neutral-400 font-tajawal mt-0.5">
              جورج وسوف <span class="text-neutral-600">•</span> XAT AUDIO
            </p>

            <!-- شريط الوقت والتمرير النحيف -->
            <div class="w-full max-w-xs sm:max-w-sm mt-3 px-1">
              <div id="progressBarContainer" onclick="handleSeek(event)" class="relative w-full h-1 bg-white/[0.08] hover:bg-white/[0.15] rounded-full cursor-pointer transition-colors">
                <div id="progressBarFill" class="absolute top-0 left-0 h-full bg-white rounded-full shadow-[0_0_6px_rgba(255,255,255,0.7)]" style="width: 0%;"></div>
              </div>
              <div class="flex items-center justify-between text-[9px] font-mono text-neutral-500 mt-1">
                <span id="currentTimeDisplay">00:00</span>
                <span id="durationDisplay">04:12</span>
              </div>
            </div>

            <!-- أزرار التحكم في التشغيل -->
            <div class="w-full max-w-xs flex items-center justify-center gap-2.5 sm:gap-3.5 mt-1.5">
              <!-- عشوائي -->
              <button id="shuffleBtn" onclick="toggleShuffle()" class="p-1 text-neutral-500 hover:text-white rounded-full cursor-pointer" title="عشوائي">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H4v-4m12-4h4v4m0 0l-5-5m5 5l-5 5M4 8l5 5"/></svg>
              </button>

              <!-- السابق -->
              <button onclick="prevTrack()" class="p-1.5 rounded-full text-neutral-300 hover:text-white hover:bg-white/[0.08] transition-all cursor-pointer" title="السابق">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
              </button>

              <!-- تشغيل / إيقاف مؤقت -->
              <button id="playPauseBtn" onclick="togglePlay()" class="p-2.5 rounded-full bg-white text-black hover:bg-neutral-200 transition-all cursor-pointer active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.35)]" title="تشغيل">
                <svg id="playIcon" class="w-4 h-4 fill-black ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" class="w-4 h-4 fill-black hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>

              <!-- التالي -->
              <button onclick="nextTrack()" class="p-1.5 rounded-full text-neutral-300 hover:text-white hover:bg-white/[0.08] transition-all cursor-pointer" title="التالي">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
              </button>

              <!-- تكرار -->
              <button id="repeatBtn" onclick="toggleRepeat()" class="p-1 text-neutral-500 hover:text-white rounded-full cursor-pointer" title="تكرار">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>

              <!-- كتم الصوت -->
              <button id="muteBtn" onclick="toggleMute()" class="p-1 text-neutral-500 hover:text-white cursor-pointer ml-1" title="كتم / إلغاء الكتم">
                <svg id="volumeIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
                <svg id="muteIcon" class="w-3.5 h-3.5 text-neutral-400 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
              </button>
            </div>

            <!-- قائمة الأغاني الـ 7 المصغرة السريعة -->
            <div id="playlistPills" class="w-full flex flex-wrap justify-center gap-1 mt-2.5 max-h-16 overflow-y-auto px-1"></div>

          </div>
        </div>

      </main>

      <!-- الجزء السفلي الثابت: عبارة GOD IS LOVE (لا تتحرك إطلاقاً) -->
      <div class="w-full h-8 flex items-center justify-center shrink-0 z-30">
        <p class="text-xs sm:text-sm font-bold tracking-[0.32em] uppercase select-none font-montserrat text-neutral-600">
          GOD IS LOVE
        </p>
      </div>

    </div>
  </div>

  <script>
    // قائمة الأغاني السبع المباشرة
    const PLAYLIST = [
      { id: 1, title: 'الحب الجميل', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-b001-71fa-a83f-618c057e8dd1', duration: '04:12' },
      { id: 2, title: 'صابر وراضي', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-af3b-72ac-8c36-843b07cfa380', duration: '03:58' },
      { id: 3, title: 'لو كل عاشق', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a0c563-aeda-70f6-ba1d-5aa4221c0d14', duration: '04:45' },
      { id: 4, title: 'ارضي بالنصيب', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d77f-7191-adc3-4dcd847dba06', duration: '05:02' },
      { id: 5, title: 'شكرا', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d6ad-7229-a218-61041759d594', duration: '03:40' },
      { id: 6, title: 'ليل العاشقين', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d773-7248-bf6c-05b5f2c85b2f', duration: '04:22' },
      { id: 7, title: 'ذكريات', artist: 'جورج وسوف', url: 'https://audio.jukehost.co.uk/01a10b9b-d6f8-7174-92fa-7b5eaa7552ff', duration: '04:50' }
    ];

    // نظام المؤثرات الصوتية للمحرك (Web Audio API)
    class SoundFx {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playEngineStart() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // صوت السلف (Cranks)
        for (let i = 0; i < 4; i++) {
          const t = now + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(45 + i * 6, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        }
        // زئير المحرك V8 Roar
        const roarStart = now + 0.48;
        const sub = this.ctx.createOscillator();
        const mid = this.ctx.createOscillator();
        const roarGain = this.ctx.createGain();
        sub.type = 'sawtooth';
        sub.frequency.setValueAtTime(65, roarStart);
        sub.frequency.exponentialRampToValueAtTime(140, roarStart + 0.22);
        sub.frequency.exponentialRampToValueAtTime(55, roarStart + 0.85);

        mid.type = 'triangle';
        mid.frequency.setValueAtTime(130, roarStart);
        mid.frequency.exponentialRampToValueAtTime(280, roarStart + 0.22);
        mid.frequency.exponentialRampToValueAtTime(110, roarStart + 0.85);

        roarGain.gain.setValueAtTime(0.01, roarStart);
        roarGain.gain.linearRampToValueAtTime(0.35, roarStart + 0.15);
        roarGain.gain.exponentialRampToValueAtTime(0.001, roarStart + 0.9);

        sub.connect(roarGain);
        mid.connect(roarGain);
        roarGain.connect(this.ctx.destination);
        sub.start(roarStart);
        mid.start(roarStart);
        sub.stop(roarStart + 0.95);
        mid.stop(roarStart + 0.95);
      }
      playThrottleRev() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(70, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }
      playClick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }
    const soundFx = new SoundFx();

    // حالة المشغل
    let currentTrackIndex = 0;
    let isPlaying = false;
    let isMuted = false;
    let isShuffle = false;
    let isRepeat = false;
    let activeTab = 'HOME';

    const audio = document.getElementById('globalAudio');
    audio.volume = 1.0; // أعلى مستوى للصوت 100% افتراضياً

    // عرض أزرار اختيار الأغاني
    function renderPills() {
      const container = document.getElementById('playlistPills');
      container.innerHTML = '';
      PLAYLIST.forEach((song, idx) => {
        const isSelected = idx === currentTrackIndex;
        const btn = document.createElement('button');
        btn.onclick = () => selectTrack(idx);
        btn.className = `text-[10px] font-tajawal px-2 py-0.5 rounded-md transition-all cursor-pointer whitespace-nowrap flex items-center gap-1 ${
          isSelected
            ? 'bg-white text-black font-bold shadow-[0_0_8px_rgba(255,255,255,0.3)]'
            : 'bg-white/[0.03] hover:bg-white/[0.08] text-neutral-400 hover:text-neutral-200 border border-transparent'
        }`;
        btn.innerHTML = `<span class="font-mono text-[9px] opacity-60">${idx + 1}</span><span>${song.title}</span>`;
        if (isSelected && isPlaying) {
          btn.innerHTML += `<span class="w-1 h-1 rounded-full bg-black animate-ping"></span>`;
        }
        container.appendChild(btn);
      });
    }

    // منطق تشغيل الصوت
    function loadTrack(idx) {
      currentTrackIndex = idx;
      const song = PLAYLIST[idx];
      audio.src = song.url;
      audio.volume = 1.0; // التأكيد على 100%
      document.getElementById('musicTitle').textContent = song.title;
      document.getElementById('musicArtist').innerHTML = `${song.artist} <span class="text-neutral-600">•</span> XAT AUDIO`;
      renderPills();
    }

    function togglePlay() {
      soundFx.init();
      if (isPlaying) {
        audio.pause();
        setPlayState(false);
      } else {
        audio.volume = 1.0;
        audio.play().then(() => setPlayState(true)).catch(() => {});
      }
    }

    function setPlayState(playing) {
      isPlaying = playing;
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const waves = document.getElementById('playingWaves');
      if (playing) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        waves.classList.remove('hidden');
        waves.classList.add('flex');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        waves.classList.add('hidden');
        waves.classList.remove('flex');
      }
      renderPills();
    }

    function selectTrack(idx) {
      loadTrack(idx);
      audio.volume = 1.0;
      audio.play().then(() => setPlayState(true)).catch(() => {});
    }

    function nextTrack() {
      let nextIdx = (currentTrackIndex + 1) % PLAYLIST.length;
      if (isShuffle) {
        nextIdx = Math.floor(Math.random() * PLAYLIST.length);
      }
      selectTrack(nextIdx);
    }

    function prevTrack() {
      let prevIdx = (currentTrackIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
      selectTrack(prevIdx);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('shuffleBtn');
      btn.className = isShuffle ? 'p-1 text-white bg-white/10 rounded-full cursor-pointer' : 'p-1 text-neutral-500 hover:text-white rounded-full cursor-pointer';
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      const btn = document.getElementById('repeatBtn');
      btn.className = isRepeat ? 'p-1 text-white bg-white/10 rounded-full cursor-pointer' : 'p-1 text-neutral-500 hover:text-white rounded-full cursor-pointer';
    }

    function toggleMute() {
      isMuted = !isMuted;
      audio.muted = isMuted;
      const volIcon = document.getElementById('volumeIcon');
      const muteIcon = document.getElementById('muteIcon');
      if (isMuted) {
        volIcon.classList.add('hidden');
        muteIcon.classList.remove('hidden');
      } else {
        volIcon.classList.remove('hidden');
        muteIcon.classList.add('hidden');
      }
    }

    function handleSeek(e) {
      const container = document.getElementById('progressBarContainer');
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percentage = Math.max(0, Math.min(1, clickX / rect.width));
      if (audio.duration) {
        audio.currentTime = percentage * audio.duration;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressBarFill').style.width = `${pct}%`;
        document.getElementById('currentTimeDisplay').textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('durationDisplay').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } else {
        nextTrack();
      }
    });

    // التنقل السلس بين التبويبات بدون أي اهتزاز في الشاشة
    function switchTab(tab) {
      soundFx.playClick();
      if (tab === activeTab) return;
      activeTab = tab;

      const homeBtn = document.getElementById('tabHomeBtn');
      const musicBtn = document.getElementById('tabMusicBtn');
      const homeContent = document.getElementById('homeTabContent');
      const musicContent = document.getElementById('musicTabContent');

      if (tab === 'HOME') {
        homeBtn.className = 'group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-100 scale-105';
        musicBtn.className = 'group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-40 hover:opacity-85';

        homeContent.classList.remove('hidden');
        musicContent.classList.add('hidden');
        musicContent.classList.remove('flex');
        setTimeout(() => {
          homeContent.classList.remove('opacity-0', 'scale-95');
          homeContent.classList.add('opacity-100', 'scale-100');
        }, 20);
      } else {
        musicBtn.className = 'group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-100 scale-105';
        homeBtn.className = 'group flex items-center gap-2 cursor-pointer transition-all duration-300 py-1 px-2 rounded-lg opacity-40 hover:opacity-85';

        homeContent.classList.add('hidden');
        homeContent.classList.remove('opacity-100', 'scale-100');
        homeContent.classList.add('opacity-0', 'scale-95');
        musicContent.classList.remove('hidden');
        musicContent.classList.add('flex');
        setTimeout(() => {
          musicContent.classList.remove('opacity-0', 'scale-95');
          musicContent.classList.add('opacity-100', 'scale-100');
        }, 20);
      }
    }

    // تفاعل النقر على شاشة البداية لتشغيل الفلاش وصوت المحرك
    let hasIgnited = false;
    document.getElementById('splashView').addEventListener('click', () => {
      if (hasIgnited) return;
      hasIgnited = true;

      soundFx.playEngineStart();

      const flash = document.getElementById('flashOverlay');
      flash.classList.remove('opacity-0');
      flash.classList.add('opacity-80');
      setTimeout(() => {
        flash.classList.remove('opacity-80');
        flash.classList.add('opacity-0');
      }, 250);

      setTimeout(() => {
        const splash = document.getElementById('splashView');
        const main = document.getElementById('mainView');
        splash.classList.add('opacity-0', 'pointer-events-none');
        main.classList.remove('opacity-0', 'pointer-events-none');
        main.classList.add('opacity-100');
      }, 650);
    });

    function restartIntro() {
      soundFx.playClick();
      hasIgnited = false;
      const splash = document.getElementById('splashView');
      const main = document.getElementById('mainView');
      main.classList.add('opacity-0', 'pointer-events-none');
      main.classList.remove('opacity-100');
      splash.classList.remove('opacity-0', 'pointer-events-none');
    }

    function triggerPhotoRev() {
      soundFx.playThrottleRev();
      const card = document.getElementById('photoCard');
      card.classList.add('ring-4', 'ring-white', 'brightness-125');
      setTimeout(() => {
        card.classList.remove('ring-4', 'ring-white', 'brightness-125');
      }, 350);
    }

    // تحميل الأغنية الأولى وضبط الصوت
    loadTrack(0);
  </script>
</body>
</html>
